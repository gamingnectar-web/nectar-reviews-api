name = "Loyalty checkout redemption"
type = "ui_extension"
api_version = "2026-04"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.jsx"

[extensions.capabilities]
api_access = true
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "app_url"
type = "single_line_text_field"
name = "App API URL"
description = "Example: https://your-render-app.onrender.com"

[[extensions.settings.fields]]
key = "shop_domain"
type = "single_line_text_field"
name = "Permanent shop domain"
description = "Example: example.myshopify.com"
