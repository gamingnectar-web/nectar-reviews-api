<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nectar Reviews Admin</title>
  <link rel="stylesheet" href="/module-shell.css?v=restore-1" />
  <link rel="stylesheet" href="/admin-responsive-polish.css?v=restore-1" />
  <link rel="stylesheet" href="/cart-rewards-admin.css?v=restore-1" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="dot live"></span> Nectar Reviews</div>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="reviews">Reviews</button>
      <button data-tab="messaging">Messaging</button>
      <button data-tab="migration">Migration Centre</button>
      <button data-tab="loyalty">Loyalty</button>
      <button data-tab="cart-rewards">Cart Rewards</button>
      <button data-tab="settings">Settings</button>
    </aside>
    <main>
      <section id="tab-dashboard" class="tab active"><h1>Dashboard</h1><div id="dashboardMetrics" class="grid"></div><div id="moduleStatus" class="grid"></div></section>
      <section id="tab-reviews" class="tab"><h1>Reviews</h1><div class="toolbar"><button id="refreshReviews">Refresh</button></div><div id="reviewsList"></div></section>
      <section id="tab-messaging" class="tab"><h1>Messaging & Campaigns</h1><div class="toolbar"><button data-message-subtab="modules" class="active">Modules</button><button data-message-subtab="templates">Templates</button></div><div id="messageModulesPanel"></div><div id="aiModuleBuilderMount"></div></section>
      <section id="tab-migration" class="tab"><h1>Review Migration Centre</h1><div id="reviewMigrationMount"></div></section>
      <section id="tab-loyalty" class="tab"><h1>Loyalty</h1><div id="loyaltyMount"></div></section>
      <section id="tab-cart-rewards" class="tab"><h1>Cart Rewards</h1><div id="cartRewardsMount"></div></section>
      <section id="tab-settings" class="tab"><h1>Settings</h1><div id="settingsMount"></div></section>
    </main>
  </div>
  <script>window.NECTAR_APP_URL='__APP_URL__'; window.NECTAR_SHOPIFY_API_KEY='__SHOPIFY_API_KEY__';</script>
  <script src="/module-registry.js?v=restore-1"></script>
  <script src="/module-shell.js?v=restore-1"></script>
  <script src="/admin.js?v=restore-1"></script>
  <script src="/admin-dashboard-analytics.js?v=restore-1"></script>
  <script src="/admin-review-manager-enhancements.js?v=restore-1"></script>
  <script src="/admin-messaging-campaigns.js?v=restore-1"></script>
  <script src="/admin-ai-module-builder.js?v=ai-modules-full-1"></script>
  <script src="/admin-review-migrations.js?v=review-migrations-full-1"></script>
  <script src="/admin-loyalty-foundation.js?v=restore-1"></script>
  <script src="/cart-rewards-admin.js?v=restore-1"></script>
  <script src="/admin-help-drawer.js?v=restore-1"></script>
</body>
</html>
