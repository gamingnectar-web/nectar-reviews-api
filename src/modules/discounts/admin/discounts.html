<section class="module-page discounts-page">
  <div class="module-header">
    <div>
      <p class="eyebrow">Commerce</p>
      <h1>Discounts</h1>
      <p>Discount logic lives in its own module, with product search available through the shared Shopify core.</p>
    </div>
  </div>

  <div class="panel-grid two">
    <section class="panel">
      <h2>Create discount rule</h2>
      <form data-discount-form>
        <label>Name <input name="name" required placeholder="10% off review reward" /></label>
        <label>Reward type
          <select name="rewardType">
            <option value="percentage">Percentage</option>
            <option value="fixed_amount">Fixed amount</option>
            <option value="free_shipping">Free shipping</option>
            <option value="free_gift">Free gift</option>
          </select>
        </label>
        <label>Value <input name="value" type="number" value="10" /></label>
        <label>Code prefix <input name="codePrefix" value="NECTAR" /></label>
        <button class="primary" type="submit">Create rule</button>
      </form>
    </section>

    <section class="panel">
      <h2>Product lookup</h2>
      <form data-product-search>
        <label>Search products <input name="q" placeholder="Search Shopify products" /></label>
        <button class="secondary" type="submit">Search</button>
      </form>
      <div data-product-results class="stacked-list"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Rules</h2>
    <div data-discount-rules class="stacked-list"></div>
  </section>
</section>
