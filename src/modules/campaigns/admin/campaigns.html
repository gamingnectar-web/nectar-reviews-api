<section class="module-page campaigns-page">
  <div class="module-header">
    <div>
      <p class="eyebrow">Planning</p>
      <h1>Campaigns</h1>
      <p>Plan campaigns across reviews, loyalty, discounts and cart rewards using one calendar.</p>
    </div>
  </div>

  <div class="panel-grid two">
    <section class="panel">
      <h2>Create campaign</h2>
      <form data-campaign-form>
        <label>Name <input name="name" required placeholder="Summer loyalty push" /></label>
        <label>Module
          <select name="moduleKey">
            <option value="general">General</option>
            <option value="reviews">Reviews</option>
            <option value="loyalty">Loyalty</option>
            <option value="discounts">Discounts</option>
            <option value="cart-rewards">Cart Rewards</option>
          </select>
        </label>
        <label>Start date <input name="startsAt" type="date" /></label>
        <label>End date <input name="endsAt" type="date" /></label>
        <label>Objective <textarea name="objective" placeholder="What should this campaign achieve?"></textarea></label>
        <button class="primary" type="submit">Create campaign</button>
      </form>
    </section>

    <section class="panel">
      <h2>Month view</h2>
      <div data-campaign-calendar class="calendar-grid"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Campaign list</h2>
    <div data-campaign-list class="stacked-list"></div>
  </section>
</section>
