<section class="module-page loyalty-page">
  <div class="module-header">
    <div>
      <p class="eyebrow">Retention</p>
      <h1>Loyalty</h1>
      <p>A private points ledger. Customer identities are stored as hashes by default.</p>
    </div>
  </div>

  <div class="metric-grid">
    <article class="metric-card"><span>Total points</span><strong data-loyalty-points>—</strong></article>
    <article class="metric-card"><span>Customers</span><strong data-loyalty-customers>—</strong></article>
    <article class="metric-card"><span>Ledger entries</span><strong data-loyalty-entries>—</strong></article>
  </div>

  <div class="panel-grid two">
    <section class="panel">
      <h2>Add manual points</h2>
      <form data-loyalty-form>
        <label>Customer reference or email <input name="customerRef" required /></label>
        <label>Points <input name="points" type="number" value="100" required /></label>
        <label>Reason <input name="reason" placeholder="Review reward" /></label>
        <button class="primary" type="submit">Add ledger entry</button>
      </form>
    </section>

    <section class="panel">
      <h2>Latest ledger</h2>
      <div data-loyalty-ledger class="stacked-list"></div>
    </section>
  </div>
</section>
