<section class="module-page reviews-page">
  <div class="module-header">
    <div>
      <p class="eyebrow">Customer proof</p>
      <h1>Reviews</h1>
      <p>Collect, verify, moderate and display product reviews without mixing this logic into other product areas.</p>
    </div>
    <button class="primary" data-action="refresh-reviews">Refresh</button>
  </div>

  <div class="metric-grid">
    <article class="metric-card"><span>Approved reviews</span><strong data-reviews-count>—</strong></article>
    <article class="metric-card"><span>Average rating</span><strong data-reviews-average>—</strong></article>
    <article class="metric-card"><span>Verification</span><strong>Server-led</strong></article>
  </div>

  <div class="panel-grid two">
    <section class="panel">
      <h2>Submit test review</h2>
      <form data-review-form>
        <label>Product / item ID <input name="itemId" required placeholder="gid://shopify/Product/123" /></label>
        <label>Rating <input name="rating" type="number" min="1" max="5" value="5" required /></label>
        <label>Name <input name="authorName" placeholder="Customer" /></label>
        <label>Title <input name="title" placeholder="Great product" /></label>
        <label>Review <textarea name="body" required placeholder="Write a short test review"></textarea></label>
        <button class="primary" type="submit">Create pending review</button>
      </form>
    </section>

    <section class="panel">
      <h2>Create one-use review link</h2>
      <form data-token-form>
        <label>Product / item ID <input name="itemId" required /></label>
        <label>Order ID <input name="orderId" /></label>
        <label>Customer email <input name="email" type="email" /></label>
        <button class="secondary" type="submit">Generate token</button>
      </form>
      <pre data-token-output class="output"></pre>
    </section>
  </div>

  <section class="panel">
    <h2>Latest reviews</h2>
    <div data-reviews-list class="stacked-list"></div>
  </section>
</section>
