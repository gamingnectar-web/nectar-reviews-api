<section class="module-page cart-rewards-page">
  <div class="module-header">
    <div>
      <p class="eyebrow">Commerce</p>
      <h1>Cart Rewards</h1>
      <p>Tiered rewards, free gifts and cart-drawer presentation options are isolated here.</p>
    </div>
  </div>

  <div class="panel-grid two">
    <section class="panel">
      <h2>Create reward campaign</h2>
      <form data-cart-reward-form>
        <label>Name <input name="name" required placeholder="Spend £50, unlock a gift" /></label>
        <label>Status
          <select name="status"><option value="draft">Draft</option><option value="active">Active</option><option value="paused">Paused</option></select>
        </label>
        <label>Drawer appearance
          <select name="drawerMode"><option value="modal">Premium modal</option><option value="slideout">Slideout</option><option value="inline">Inline block</option></select>
        </label>
        <label>Start date <input name="startsAt" type="date" /></label>
        <label>End date <input name="endsAt" type="date" /></label>
        <button class="primary" type="submit">Create campaign</button>
      </form>
    </section>

    <section class="panel calendar-panel">
      <h2>Campaign calendar</h2>
      <div data-cart-calendar class="calendar-grid"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Campaigns</h2>
    <div data-cart-campaigns class="stacked-list"></div>
  </section>
</section>
